name: Teleagent non-promotable release evidence

on:
  workflow_dispatch:

concurrency:
  group: teleagent-release-candidate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-release-evidence:
    if: >-
      github.repository == 'javAlborz/teleagent' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main'
    runs-on:
      - self-hosted
      - Linux
      - X64
      - ci-build
      - teleagent
    timeout-minutes: 120
    env:
      CI: 'true'
      TELEAGENT_CI_RELEASE_BUILD: '1'
    steps:
      - name: Check out the exact workflow commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          clean: true
          persist-credentials: false

      - name: Require the repo-scoped Hephaestus guest
        shell: /usr/bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          [[ "$RUNNER_NAME" == 'hephaestus-ci-build-vm01-teleagent' ]]
          [[ "$RUNNER_OS" == 'Linux' ]]
          [[ "$RUNNER_ARCH" == 'X64' ]]
          ulimit -c 0

      - name: Build, scan, and reproduce the v2 closure
        shell: /usr/bin/bash --noprofile --norc -euo pipefail {0}
        run: /usr/bin/bash scripts/release/build-ci-release.sh

      - name: Upload release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: teleagent-nonpromotable-release-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/teleagent-release-output/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          include-hidden-files: false
