name: Teleagent pull request validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: teleagent-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
      HUSKY: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out the exact validation commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          clean: true
          persist-credentials: false

      - name: Install Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install locked dependencies
        shell: /usr/bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          npm ci
          for package_dir in \
            cli \
            claude-api-server \
            voice-app \
            privileged-action-broker \
            realtime-sip-gateway; do
            npm --prefix "$package_dir" ci
          done

      - name: Lint
        run: npm run lint

      - name: Test
        shell: /usr/bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          ulimit -c 0
          npm test

      - name: Test release and supply-chain contracts
        shell: /usr/bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          ulimit -c 0
          python3 -m unittest discover -s scripts/release -p 'test_*.py'

      - name: Verify a clean generated state
        shell: /usr/bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          git diff --check
          git diff --quiet
          git diff --cached --quiet
          test -z "$(git ls-files --others --exclude-standard)"
